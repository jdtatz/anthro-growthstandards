name: CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "*.*"
      - "*.*.*"
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_OVERRIDES_FOR_GROWTHSTANDARDS: '{local_scheme = "no-local-version-strict"}'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish Python distribution
    if: github.event_name != 'pull_request' && github.repository == 'jdtatz/anthro-growthstandards' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release from a Tag
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: dist/*

      # - name: Publish distribution to PyPI
      #   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      #   uses: pypa/gh-action-pypi-publish@release/v1
