[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "growthstandards"
authors = [{ name = "Julia Tatz", email = "julia.tatz@childrens.harvard.edu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.16",
    "array-api-extra",
    "typing_extensions >= 4.10",
]
dynamic = ["version"]

[project.optional-dependencies]
tfp = ["tensorflow_probability[jax]"]

[tool.setuptools]
packages = ["growthstandards"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # Pylint
    "PL",
    # pyupgrade
    "UP",
    # isort
    "I",
    # Ruff-specific rules
    "RUF",
    # NumPy-specific rules
    "NPY",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-boolean-trap
    "FBT",
    # flake8-simplify
    "SIM",
]
ignore = [
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison

    # These are enforced by, or incompatible with, the ruff formatter:
    "E203", # whitespace-before-punctuation
    "E501", # line-too-long
]
# Disable fix for unused imports (`F401`).
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"growthstandards/bcs_ext/scipy_ext.py" = [
    "FBT003", # boolean-positional-value-in-call
]
"growthstandards/bcs_ext/tfp_jax_ext.py" = [
    "FBT",
    "PLC0415", # import-outside-top-level
    "PLE0101", # return-in-init
    "PLR0917", # too-many-positional-arguments
    "PLR1704", # redefined-argument-from-local
]
